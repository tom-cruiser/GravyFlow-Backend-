# ============================================================================
# GRAVYFLOW DOCKER COMPOSE
# ============================================================================
# Production-ready Docker Compose configuration for GravyFlow deployment platform
# with resource limits, health checks, and monitoring support.
# 
# Usage:
#   docker-compose up -d                    # Start all services
#   docker-compose --profile monitoring up -d  # Start with monitoring
#   docker-compose --profile production up -d  # Start with nginx
#   docker-compose down -v                  # Stop and remove volumes
# ============================================================================

version: '3.8'

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  gravyflow-network:
    name: gravyflow-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  # User app containers + Caddy only — kept separate from gravyflow-network so
  # deployed apps can't reach Postgres, Redis or the API. The API also creates
  # it on first deploy, so it's external here: create it once with
  #   docker network create gravyflow-apps
  gravyflow-apps:
    name: gravyflow-apps
    external: true

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgres-data:
    name: gravyflow-postgres-data
  postgres-backup:
    name: gravyflow-postgres-backup
  redis-data:
    name: gravyflow-redis-data
  app-builds:
    name: gravyflow-app-builds
  nixpacks-cache:
    name: gravyflow-nixpacks-cache
  prometheus-data:
    name: gravyflow-prometheus-data
  grafana-data:
    name: gravyflow-grafana-data
  caddy-data:
    name: gravyflow-caddy-data

# ============================================================================
# SERVICES
# ============================================================================

services:
  # ==========================================================================
  # POSTGRESQL
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: gravyflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gravyflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackey333Vi@32}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backup:/backup
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - gravyflow-network
    depends_on:
      gravyflow-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gravyflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPU_LIMIT:-2}'
          memory: ${POSTGRES_MEMORY_LIMIT:-2G}
        reservations:
          cpus: '${POSTGRES_CPU_RESERVATION:-0.5}'
          memory: ${POSTGRES_MEMORY_RESERVATION:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.gravyflow.service=postgres"
      - "com.gravyflow.environment=${ENVIRONMENT:-development}"

  # ==========================================================================
  # POSTGRES BACKUP
  # ==========================================================================
  postgres-backup:
    image: postgres:15-alpine
    container_name: gravyflow-postgres-backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-gravyflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackey333Vi@32}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - postgres-backup:/backup
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - gravyflow-network
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: |
      sh -c "
        echo '0 2 * * * /backup.sh' > /etc/crontab &&
        crond -f -l 2
      "
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - "com.gravyflow.service=postgres-backup"
    profiles:
      - backup

  # ==========================================================================
  # REDIS
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: gravyflow-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      # Host access is for local tooling only; the API uses redis:6379 on the
      # compose network. Loopback, since Redis has no password here.
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    networks:
      - gravyflow-network
    depends_on:
      gravyflow-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPU_LIMIT:-1}'
          memory: ${REDIS_MEMORY_LIMIT:-1G}
        reservations:
          cpus: '${REDIS_CPU_RESERVATION:-0.25}'
          memory: ${REDIS_MEMORY_RESERVATION:-256M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.gravyflow.service=redis"
      - "com.gravyflow.environment=${ENVIRONMENT:-development}"

  # ==========================================================================
  # VOLUME INIT
  # ==========================================================================
  # Named volumes are created root-owned by Docker the first time they're
  # used, which silently overrides whatever each image's Dockerfile chowned
  # at build time — every service below runs as a non-root uid and can't
  # write into a root-owned mount. That's what produced "create app build
  # root: mkdir /var/lib/gravyflow/apps: permission denied" for the api
  # service, and the identical "mkdir ... Permission denied" for postgres's
  # pgdata, both only on a volume's first use (a fresh host, or after
  # `compose down -v`). This fixes ownership for every affected volume
  # before its service starts, every time, so the stack self-heals
  # regardless of whether the volumes are fresh or pre-existing — no manual
  # chown ever needed. Per-image uids confirmed via `docker run <image:tag>
  # id <user>` against the EXACT tags this compose file uses — postgres:15
  # (Debian) and postgres:15-alpine use different uids for the same
  # "postgres" username, which is what made an earlier version of this fix
  # chown pgdata to the wrong owner (999:999, copied from the wrong tag) and
  # break a volume that was otherwise fine: gravyflow-api runs as uid 1000
  # (Dockerfile's `gravyflow` user); postgres:15-alpine's `postgres` user is
  # 70:70; redis:7-alpine's `redis` user is 999:1000. Caddy runs as root, so
  # caddy-data needs nothing.
  gravyflow-volume-init:
    image: busybox:latest
    container_name: gravyflow-volume-init
    command:
      - sh
      - -c
      - |
        chown -R 1000:1000 /var/lib/gravyflow/apps /var/cache/nixpacks
        chown -R 70:70 /pgdata
        chown -R 999:1000 /redisdata
    volumes:
      - app-builds:/var/lib/gravyflow/apps
      - nixpacks-cache:/var/cache/nixpacks
      - postgres-data:/pgdata
      - redis-data:/redisdata
    # Every other service explicitly joins gravyflow-network; without the
    # same here, Compose creates an implicit project-default network that
    # grabs gravyflow-network's own hardcoded 172.20.0.0/16 subnet the
    # moment this service exists, and gravyflow-network then fails to
    # create with a pool-overlap error.
    networks:
      - gravyflow-network
    restart: "no"

  # ==========================================================================
  # API
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
      args:
        BUILD_VERSION: ${BUILD_VERSION:-latest}
        BUILD_TIME: ${BUILD_TIME:-}
    image: gravyflow-api:${IMAGE_TAG:-latest}
    container_name: gravyflow-api
    # Tiny init as PID 1: git helpers (git-remote-https, ssh) orphaned when a
    # stalled clone is killed are otherwise never reaped and pile up as zombies.
    init: true
    # Load environment variables from .env file
    env_file:
      - .env
    environment:
      # Database (using values from .env)
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:blackey333Vi@32@postgres:5432/gravyflow?sslmode=disable}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-gravyflow}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-blackey333Vi@32}
      # GRAVYFLOW_DB_TARGET=local makes the API ignore DATABASE_URL (e.g. a
      # remote Neon URL kept in .env) and use the "postgres" service in this
      # file via the PG* variables above. Empty/anything else = use DATABASE_URL.
      GRAVYFLOW_DB_TARGET: ${GRAVYFLOW_DB_TARGET:-}

      # Deployment worker + git clone tuning (see cmd/api/git_progress.go,
      # repo_preflight.go). Concurrency 1 serialised every clone and build
      # platform-wide, so one slow clone blocked all other deploys.
      ASYNQ_CONCURRENCY: ${ASYNQ_CONCURRENCY:-2}
      GRAVYFLOW_GIT_CLONE_TIMEOUT: ${GRAVYFLOW_GIT_CLONE_TIMEOUT:-10m}
      GRAVYFLOW_GIT_STALL_TIMEOUT: ${GRAVYFLOW_GIT_STALL_TIMEOUT:-2m}
      GRAVYFLOW_MAX_CLONE_SIZE_MB: ${GRAVYFLOW_MAX_CLONE_SIZE_MB:-500}
      
      # Redis
      REDIS_ADDR: redis:6379
      
      # Server
      PORT: ${PORT:-8080}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DEBUG: ${DEBUG:-true}
      
      # Security (from .env)
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      APP_ENV_ENCRYPTION_KEY: ${APP_ENV_ENCRYPTION_KEY:-}
      
      # Database Connection
      PGCONNECTATTEMPTS: ${PGCONNECTATTEMPTS:-30}
      PGCONNECTRETRYINTERVAL: ${PGCONNECTRETRYINTERVAL:-1s}
      PGMAXCONNS: ${PGMAXCONNS:-10}
      PGMINCONNS: ${PGMINCONNS:-2}
      PGMAXCONNLIFETIME: ${PGMAXCONNLIFETIME:-30m}
      PGMAXCONNIDLETIME: ${PGMAXCONNIDLETIME:-5m}
      
      # Routing — the API pushes app routes to Caddy's admin API.
      CADDY_ADMIN_URL: http://caddy:2019
      GRAVYFLOW_APPS_DOMAIN: ${GRAVYFLOW_APPS_DOMAIN:-localhost}
      GRAVYFLOW_APPS_URL_SCHEME: ${GRAVYFLOW_APPS_URL_SCHEME:-http}
      GRAVYFLOW_APPS_NETWORK: gravyflow-apps

      # Build Configuration
      GRAVYFLOW_APPS_DIR: ${GRAVYFLOW_APPS_DIR:-/var/lib/gravyflow/apps}
      NIXPACKS_CACHE_DIR: ${NIXPACKS_CACHE_DIR:-/var/cache/nixpacks}
      GRAVYFLOW_DISABLE_BUILDKIT: ${GRAVYFLOW_DISABLE_BUILDKIT:-0}
      
      # Health Checker
      HEALTH_CHECKER_INTERVAL: ${HEALTH_CHECKER_INTERVAL:-30s}
      
      # Metrics
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      METRICS_PORT: ${METRICS_PORT:-9090}
      
      # Rate Limiting
      RATE_LIMIT: ${RATE_LIMIT:-100}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
      
      # Timeouts
      SHUTDOWN_GRACE: ${SHUTDOWN_GRACE:-30s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-15s}
      READ_TIMEOUT: ${READ_TIMEOUT:-15s}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-60s}
    # The image runs as non-root; the host's docker.sock is root:docker 660,
    # so the container needs the host docker group's GID (`getent group docker`).
    group_add:
      - "${DOCKER_GID:-972}"
    # Without this, Docker copies the host's /etc/resolv.conf verbatim into
    # the container. On a host using systemd-resolved (common on Debian/
    # Ubuntu) that file points at 127.0.0.53, its local-only stub resolver —
    # unreachable from inside a container's own network namespace. DATABASE_URL
    # here can point at an external host (e.g. a managed Postgres provider),
    # which then fails DNS resolution entirely. Public resolvers sidestep it.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - app-builds:/var/lib/gravyflow/apps
      - nixpacks-cache:/var/cache/nixpacks
      - ./configs:/app/configs:ro
      - ./secret:/app/secret:ro
    ports:
      - "${API_PORT:-8080}:8080"
      - "${METRICS_PORT:-9090}:9090"
    networks:
      - gravyflow-network
    depends_on:
      gravyflow-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${PORT:-8080}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${API_CPU_LIMIT:-4}'
          memory: ${API_MEMORY_LIMIT:-4G}
        reservations:
          cpus: '${API_CPU_RESERVATION:-0.5}'
          memory: ${API_MEMORY_RESERVATION:-512M}
      replicas: ${API_REPLICAS:-1}
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "com.gravyflow.service=api"
    labels:
      - "com.gravyflow.service=api"
      - "com.gravyflow.environment=${ENVIRONMENT:-development}"
      - "com.gravyflow.version=${BUILD_VERSION:-latest}"

  # ==========================================================================
  # CADDY (routes <app>.<GRAVYFLOW_APPS_DOMAIN> to app containers)
  # ==========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: gravyflow-caddy
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      # Admin API has no auth — only ever publish it on loopback.
      - "127.0.0.1:${CADDY_ADMIN_PORT:-2019}:2019"
    networks:
      - gravyflow-network
      - gravyflow-apps
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.gravyflow.service=caddy"

  # ==========================================================================
  # PROMETHEUS (Monitoring)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: gravyflow-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    networks:
      - gravyflow-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.gravyflow.service=prometheus"
    profiles:
      - monitoring

  # ==========================================================================
  # GRAFANA (Dashboards)
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: gravyflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - gravyflow-network
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.gravyflow.service=grafana"
    profiles:
      - monitoring

  # ==========================================================================
  # NGINX (Reverse Proxy - Production)
  # ==========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: gravyflow-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    networks:
      - gravyflow-network
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.gravyflow.service=nginx"
    profiles:
      - production